# PR が登録簿をどう書き換えるかを、main の検査で確かめる（公開済みの版は変えない・書き換えるのは持ち主だけ）。
#
# pull_request_target なので、このワークフローと検査のコードは main のものが動く。PR の側はデータとして
# `pr/` に取り出すだけで、その中のコードや npm のスクリプトは動かさない。トークンは読み取りだけ。
name: registry

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: registry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      # main（信用するコード）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # PR の後の中身（データとして読むだけ）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: npm ci --ignore-scripts
      - name: Check how the pull request changes the registry
        run: node src/pr-main.ts plugins pr/plugins
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
